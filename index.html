<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasteliBot — Gestión de Repostería</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{--bg:#FDF6EE;--bg-deep:#F5EBDD;--chat-bg:#FAF0E4;--bot-bubble:#FFFFFF;--user-bubble:#C8553D;--user-bubble-text:#FFFFFF;--bot-text:#3D2B1F;--muted:#9C8B7D;--accent:#C8553D;--accent-soft:#E8856F;--accent-glow:rgba(200,85,61,0.15);--gold:#D4A24E;--gold-soft:#F0D9A8;--card:#FFFFFF;--border:rgba(60,40,20,0.08);--danger:#DC2626;--danger-bg:#FEE2E2;--success:#059669;--success-bg:#D1FAE5;--shadow-sm:0 1px 3px rgba(60,30,10,0.06);--shadow-md:0 4px 16px rgba(60,30,10,0.08);--shadow-lg:0 8px 32px rgba(60,30,10,0.12);--radius:16px;--radius-input:24px;--font-ui:'DM Sans',sans-serif;--font-display:'Playfair Display',serif;}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:var(--font-ui);background:var(--bg);color:var(--bot-text);overflow:hidden;}
  .app-container{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;background:var(--chat-bg);box-shadow:var(--shadow-lg);}
  @media(min-width:768px){body{display:flex;align-items:center;justify-content:center;padding:20px;}.app-container{height:92vh;border-radius:28px;overflow:hidden;}}
  .app-header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(135deg,var(--card) 0%,#FFF8F0 100%);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;}
  .header-avatar{position:relative;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 0%,var(--gold) 100%);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 2px 10px var(--accent-glow);}
  .header-info{flex:1;min-width:0;}
  .header-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.2;}
  .header-sub-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:1px;}
  .conn-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:9.5px;font-weight:700;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:0.5px;transition:all 0.3s;}
  .conn-badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .conn-badge.checking{background:#FEF3C7;color:#D97706;}.conn-badge.online{background:#D1FAE5;color:#059669;}.conn-badge.offline{background:#FEE2E2;color:#DC2626;}
  .conn-badge.online .dot{animation:pulse-dot 2s ease-in-out infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}
  .db-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .db-badge.ok{color:var(--success);}.db-badge.err{color:var(--danger);}.db-badge.wait{color:var(--gold);}
  .view-container{flex:1;overflow:hidden;position:relative;}
  .view{display:none;flex-direction:column;height:100%;}.view.active{display:flex;}
  .chat-body{flex:1;overflow-y:auto;padding:20px 16px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;background-image:radial-gradient(circle at 20% 50%,rgba(212,162,78,0.04) 0%,transparent 50%);}
  .chat-body::-webkit-scrollbar{width:5px;}.chat-body::-webkit-scrollbar-thumb{background:rgba(156,139,125,0.25);border-radius:10px;}
  .msg-wrapper{display:flex;flex-direction:column;max-width:85%;animation:msg-in 0.3s ease both;}
  @keyframes msg-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .msg-wrapper.bot{align-self:flex-start;padding-left:34px;position:relative;}
  .msg-wrapper.user{align-self:flex-end;}
  .msg-bubble{padding:12px 16px;font-size:14.5px;line-height:1.55;word-wrap:break-word;}
  .msg-wrapper.bot .msg-bubble{background:var(--bot-bubble);color:var(--bot-text);border-radius:4px 20px 20px 20px;box-shadow:var(--shadow-sm);}
  .msg-wrapper.user .msg-bubble{background:var(--user-bubble);color:var(--user-bubble-text);border-radius:20px 4px 20px 20px;}
  .msg-bubble.action-ok{background:var(--success-bg)!important;border-left:3px solid var(--success);}
  .msg-bubble.action-err{background:var(--danger-bg)!important;border-left:3px solid var(--danger);}
  .msg-wrapper.bot::before{content:'';position:absolute;left:0;top:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--gold));opacity:0.5;}
  .msg-wrapper.bot::after{content:'🧁';position:absolute;left:3px;top:5px;font-size:14px;}
  .msg-time{font-size:10.5px;color:var(--muted);margin-top:4px;padding:0 4px;opacity:0.7;}
  .msg-wrapper.user .msg-time{text-align:right;}
  .msg-wrapper.bot .msg-bubble .rich-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;border-radius:10px;overflow:hidden;}
  .msg-wrapper.bot .msg-bubble .rich-table th{background:var(--accent);color:#fff;padding:7px 10px;font-weight:700;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;}
  .msg-wrapper.bot .msg-bubble .rich-table td{padding:6px 10px;border-bottom:1px solid var(--border);}
  .msg-wrapper.bot .msg-bubble .rich-table tr:last-child td{border-bottom:none;}
  .msg-wrapper.bot .msg-bubble .rich-list{list-style:none;margin:6px 0;padding:0;}
  .msg-wrapper.bot .msg-bubble .rich-list li{padding:3px 0 3px 18px;position:relative;}
  .msg-wrapper.bot .msg-bubble .rich-list li::before{content:'';position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .msg-wrapper.bot .msg-bubble .rich-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:8px 0;}
  .msg-wrapper.bot .msg-bubble .rich-section{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--gold-soft);display:inline-block;}
  .msg-wrapper.bot .msg-bubble .rich-price{display:inline-block;background:var(--accent-glow);color:var(--accent);font-weight:700;padding:1px 8px;border-radius:6px;font-size:13.5px;}
  .chat-btn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:10px 20px;border-radius:14px;border:none;font-family:var(--font-ui);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .chat-btn:hover{transform:translateY(-1px);}.chat-btn:active{transform:translateY(0);}
  .chat-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;box-shadow:0 3px 12px rgba(200,85,61,0.3);}
  .chat-btn.secondary{background:var(--bg);color:var(--bot-text);border:1.5px solid var(--border);}
  .chat-btn.success{background:linear-gradient(135deg,var(--success),#34d399);color:#fff;box-shadow:0 3px 12px rgba(5,150,105,0.3);}
  .chat-btn.warn{background:var(--gold-soft);color:var(--bot-text);}
  .recipe-summary{background:linear-gradient(135deg,var(--accent-glow),rgba(212,162,78,0.08));border-radius:14px;padding:16px;margin:10px 0;border:1.5px solid var(--gold-soft);}
  .recipe-summary h3{font-family:var(--font-display);font-size:18px;margin-bottom:10px;}
  .recipe-summary .item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:14px;}
  .recipe-summary .item:last-child{border-bottom:none;}
  .recipe-summary .item .label{color:var(--muted);}.recipe-summary .item .val{font-weight:700;}
  .recipe-summary .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .ocr-preview{border-radius:14px;overflow:hidden;margin:10px 0;border:2px solid var(--gold-soft);}
  .ocr-preview img{width:100%;max-height:250px;object-fit:contain;background:#fff;display:block;}
  .ocr-progress{margin:10px 0;}
  .ocr-progress .bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .ocr-progress .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width 0.3s;}
  .ocr-progress .bar-label{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;}
  .factura-table{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0;font-size:13px;border-radius:10px;overflow:hidden;border:1.5px solid var(--gold-soft);}
  .factura-table th{background:var(--gold-soft);color:var(--bot-text);padding:8px 6px;font-weight:700;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;}
  .factura-table td{padding:5px 6px;border-bottom:1px solid var(--border);background:#fff;}
  .factura-table tr:last-child td{border-bottom:none;}
  .factura-table input{width:100%;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-family:var(--font-ui);font-size:13px;outline:none;background:var(--bg);}
  .factura-table input:focus{border-color:var(--accent-soft);}
  .factura-table .del-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px;transition:all 0.2s;}
  .factura-table .del-btn:hover{background:var(--danger-bg);}
  .factura-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .typing-indicator{display:none;align-self:flex-start;padding-left:34px;position:relative;}
  .typing-indicator.visible{display:flex;}
  .typing-indicator::before{content:'';position:absolute;left:0;top:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--gold));opacity:0.5;}
  .typing-indicator::after{content:'🧁';position:absolute;left:3px;top:5px;font-size:14px;}
  .typing-bubble{background:var(--bot-bubble);border-radius:4px 20px 20px 20px;padding:14px 20px;box-shadow:var(--shadow-sm);display:flex;gap:5px;align-items:center;}
  .typing-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.4s infinite;}
  .typing-dot:nth-child(2){animation-delay:0.15s}.typing-dot:nth-child(3){animation-delay:0.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.35}30%{transform:translateY(-7px);opacity:1}}
  .quick-suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 4px;flex-shrink:0;}
  .suggestion-chip{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--bot-text);font-size:13px;font-family:var(--font-ui);cursor:pointer;transition:all 0.2s;font-weight:500;}
  .suggestion-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);}
  .chat-input-area{padding:10px 16px 12px;flex-shrink:0;}
  .input-row{display:flex;align-items:flex-end;gap:6px;background:var(--card);border-radius:var(--radius-input);padding:5px 5px 5px 16px;box-shadow:var(--shadow-md);border:1.5px solid var(--border);transition:border-color 0.25s;}
  .input-row:focus-within{border-color:var(--accent-soft);box-shadow:var(--shadow-md),0 0 0 3px var(--accent-glow);}
  .chat-textarea{flex:1;border:none;outline:none;font-family:var(--font-ui);font-size:15px;color:var(--bot-text);resize:none;background:transparent;padding:8px 0;max-height:110px;line-height:1.45;}
  .chat-textarea::placeholder{color:var(--muted);}
  .camera-btn{width:42px;height:42px;border-radius:50%;border:2px dashed var(--gold);background:var(--gold-soft);color:var(--gold);font-size:18px;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .camera-btn:hover{background:var(--gold);color:#fff;border-style:solid;transform:scale(1.08);box-shadow:0 2px 10px rgba(212,162,78,0.35);}
  .camera-btn:active{transform:scale(0.95);}
  .camera-btn .cam-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;}
  .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:17px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .send-btn:hover{background:var(--accent-soft);}
  .send-btn:disabled{background:var(--muted);cursor:not-allowed;}
  .inv-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;flex-shrink:0;}
  .inv-title{font-family:var(--font-display);font-size:22px;font-weight:900;}
  .inv-tabs{display:flex;gap:6px;padding:0 20px 12px;flex-shrink:0;}
  .inv-tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s;color:var(--muted);}
  .inv-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(200,85,61,0.25);}
  .inv-list{flex:1;overflow-y:auto;padding:0 16px 80px;display:flex;flex-direction:column;gap:10px;}
  .inv-list::-webkit-scrollbar{width:5px;}.inv-list::-webkit-scrollbar-thumb{background:rgba(156,139,125,0.25);border-radius:10px;}
  .inv-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;transition:all 0.2s;border:1.5px solid transparent;}
  .inv-card:hover{border-color:var(--gold-soft);box-shadow:var(--shadow-md);}
  .inv-card-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .inv-card-icon.ing{background:#FEF3C7;color:#D97706;}.inv-card-icon.rec{background:#D1FAE5;color:#059669;}
  .inv-card-info{flex:1;min-width:0;}.inv-card-name{font-size:15px;font-weight:700;margin-bottom:2px;text-transform:capitalize;}
  .inv-card-detail{font-size:12.5px;color:var(--muted);}.inv-card-price{font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0;}
  .stock-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;flex-shrink:0;}
  .stock-badge.ok{background:#D1FAE5;color:#059669;}.stock-badge.low{background:#FEF3C7;color:#D97706;}.stock-badge.out{background:#FEE2E2;color:#DC2626;}
  .inv-card-actions{display:flex;flex-direction:column;gap:6px;margin-left:4px;}
  .inv-btn{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s;}
  .inv-btn.edit{background:var(--bg);color:var(--muted);}.inv-btn.edit:hover{background:var(--gold-soft);color:var(--gold);}
  .inv-btn.delete{background:var(--bg);color:var(--muted);}.inv-btn.delete:hover{background:var(--danger-bg);color:var(--danger);}
  .fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-soft));color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(200,85,61,0.35);transition:all 0.2s;display:flex;align-items:center;justify-content:center;z-index:5;}
  .fab:hover{transform:scale(1.08);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--muted);gap:8px;}
  .empty-state i{font-size:36px;opacity:0.3;margin-bottom:4px;}
  .bottom-nav{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;padding:6px 0 env(safe-area-inset-bottom);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;color:var(--muted);transition:all 0.2s;background:none;border:none;font-family:var(--font-ui);}
  .nav-item i{font-size:18px;}.nav-item span{font-size:10.5px;font-weight:600;}
  .nav-item.active{color:var(--accent);}.nav-item.active i{transform:scale(1.1);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
  .modal-overlay.visible{display:flex;}
  .modal-card{background:var(--card);border-radius:20px;padding:28px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);animation:modal-in 0.3s ease;}
  @keyframes modal-in{from{opacity:0;transform:scale(0.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:20px;}
  .form-group{margin-bottom:16px;}.form-label{font-size:12px;font-weight:600;color:var(--bot-text);margin-bottom:6px;display:block;}
  .form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:var(--font-ui);font-size:14px;outline:none;background:var(--bg);transition:border-color 0.2s;}
  .form-input:focus{border-color:var(--accent-soft);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-btn{flex:1;padding:11px;border-radius:12px;font-family:var(--font-ui);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;}
  .modal-btn.secondary{background:var(--bg);color:var(--bot-text);}.modal-btn.primary{background:var(--accent);color:#fff;}.modal-btn.primary:hover{background:var(--accent-soft);}.modal-btn.danger{background:var(--danger);color:#fff;}
  .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;}
  .toast{background:var(--bot-text);color:var(--bg);padding:10px 20px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-lg);animation:toast-in 0.3s ease,toast-out 0.3s ease 2.7s both;pointer-events:auto;}
  @keyframes toast-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes toast-out{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
  .spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.2s!important;}}
</style>
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <div class="header-avatar"><i class="fa-solid fa-cookie-bite"></i></div>
    <div class="header-info">
      <div class="header-title-row"><span id="headerTitleText">PasteliBot</span><span class="conn-badge checking" id="connBadge"><span class="dot"></span><span id="connText">VERIFICANDO</span></span></div>
      <div class="header-sub-row"><span id="headerSubText">Asistente de reposteria</span><span class="db-badge wait" id="dbBadge"><i class="fa-solid fa-database"></i> <span id="dbText">Supabase</span></span></div>
    </div>
  </header>
  <div class="view-container">
    <section class="view active" id="viewChat">
      <div class="chat-body" id="chatBody">
        <div id="welcomeScreen" style="display:flex;flex-direction:column;align-items:center;padding:30px 20px;text-align:center;gap:16px;">
          <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 6px 24px var(--accent-glow);animation:float-icon 3s ease-in-out infinite;">🧁</div>
          <style>@keyframes float-icon{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style>
          <h1 style="font-family:var(--font-display);font-size:24px;font-weight:900;">Hola, soy PasteliBot</h1>
          <p style="font-size:14px;color:var(--muted);line-height:1.5;max-width:300px;">Tu asistente experto en costos, recetas, margenes e inventario</p>
        </div>
        <div class="typing-indicator" id="typingIndicator"><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
      </div>
      <div class="quick-suggestions" id="suggestions">
        <button class="suggestion-chip" data-q="Cuanto tengo en inventario?">Mi inventario</button>
        <button class="suggestion-chip" data-q="Quiero agregar una receta">Agregar receta</button>
        <button class="suggestion-chip" data-q="Quiero escanear una factura">Escanear factura</button>
      </div>
      <div class="chat-input-area">

   ACCIONES DB — parseBotResponse CORREGIDO
   ═══════════════════════════════════════════ */
function parseBotResponse(text) {
  var regex = /\{\{ACCION:(\w+)\|?(\{[\s\S]*?\})?\}\}/;
  var match = text.match(regex);
  if (match) {
    var actionData = null;
    if (match[2]) {
      try { actionData = JSON.parse(match[2]); } catch (e) { /* ignorar parse error */ }
    }
    return {
      text: text.replace(regex, '').trim(),
      action: { type: match[1], data: actionData || {} }
    };
  }
  return { text: text, action: null };
}

async function executeDbAction(action) {
  try {
    if (action.type === 'REGISTRAR_INGREDIENTE') {
      var payload = {
        nombre: action.data.nombre,
        precio_actual: action.data.precio_actual,
        unidad: action.data.unidad,
        cantidad: action.data.cantidad || 0
      };
      var res = await supabaseClient.from('ingredientes').insert([payload]).select();
      if (res.error) throw res.error;
      return { success: true, message: 'Ingrediente **' + payload.nombre + '** registrado a **$' + Number(payload.precio_actual).toLocaleString('es-AR') + '/' + payload.unidad + '**' };
    }
    if (action.type === 'ACTUALIZAR_PRECIO') {
      var res = await supabaseClient.from('ingredientes').update({ precio_actual: action.data.precio_actual }).eq('nombre', action.data.nombre).select();
      if (res.error) throw res.error;
      if (!res.data || !res.data.length) throw new Error('"' + action.data.nombre + '" no encontrado');
      return { success: true, message: 'Precio de **' + action.data.nombre + '** actualizado a **$' + Number(action.data.precio_actual).toLocaleString('es-AR') + '**' };
    }
    if (action.type === 'ACTUALIZAR_STOCK') {
      var res = await supabaseClient.from('ingredientes').update({ cantidad: action.data.cantidad }).eq('nombre', action.data.nombre).select();
      if (res.error) throw res.error;
      if (!res.data || !res.data.length) throw new Error('"' + action.data.nombre + '" no encontrado');
      return { success: true, message: 'Stock de **' + action.data.nombre + '** actualizado a **' + action.data.cantidad + '**' };
    }
    return { success: false, message: '' };
  } catch (err) {
    console.error('Error accion:', err);
    return { success: false, message: 'Error: ' + (err.message || 'Verifica los datos') };
  }
}

/* Renderizado rico */
function formatInline(t) {
  t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\$([\d.,]+)/g, '<span class="rich-price">$$$1</span>');
  return t;
}

function renderRichText(rawText) {
  var text = rawText.replace(/\{\{ACCION:[\s\S]*?\}\}/g, '').trim();
  if (!text) return '';
  var lines = text.split('\n');
  var html = '';
  var tableLines = [];
  var inTable = false;

  function flushTable() {
    if (!tableLines.length) return;
    var rows = tableLines.map(function(l) {
      return l.split('|').map(function(c) { return c.trim(); }).filter(function(c) { return c !== ''; });
    });
    var t = '<table class="rich-table"><thead><tr>';
    if (rows.length > 0) {
      rows[0].forEach(function(h) { t += '<th>' + formatInline(h) + '</th>'; });
    }
    t += '</tr></thead><tbody>';
    for (var i = 1; i < rows.length; i++) {
      t += '<tr>';
      rows[i].forEach(function(cell) { t += '<td>' + formatInline(cell) + '</td>'; });
      t += '</tr>';
    }
    t += '</tbody></table>';
    html += t;
    tableLines = [];
    inTable = false;
  }

  for (var li = 0; li < lines.length; li++) {
    var line = lines[li];
    var trimmed = line.trim();
    if (inTable && /^\|[\s\-:|]+\|$/.test(trimmed)) continue;
    if (trimmed.indexOf('|') >= 0 && (trimmed.match(/\|/g) || []).length >= 2) {
      if (!inTable) { inTable = true; tableLines = []; }
      tableLines.push(trimmed);
      continue;
    }
    if (inTable) flushTable();
    if (/^---+$/.test(trimmed)) { html += '<div class="rich-divider"></div>'; continue; }
    if (/^[•\-\*]\s/.test(trimmed)) { html += '<div class="rich-list"><li>' + formatInline(trimmed.replace(/^[•\-\*]\s/, '')) + '</li></div>'; continue; }
    if (/^[A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s:]{3,30}$/.test(trimmed)) { html += '<div class="rich-section">' + trimmed + '</div>'; continue; }
    if (!trimmed) { html += '<br>'; continue; }
    html += '<p style="margin:2px 0">' + formatInline(trimmed) + '</p>';
  }
  if (inTable) flushTable();
  return html;
}

/* ═══════════════════════════════════════════
   OCR - ESCANEO DE FACTURAS
   ═══════════════════════════════════════════ */
cameraBtn.addEventListener('click', function() { fileInput.click(); });
fileInput.addEventListener('change', async function(e) {
  var file = e.target.files[0];
  if (!file) return;
  fileInput.value = '';
  await processFacturaImage(file);
});

async function processFacturaImage(file) {
  var imgUrl = URL.createObjectURL(file);
  addBotCustomMessage(
    '<div class="ocr-preview"><img src="' + imgUrl + '" alt="Factura"></div>' +
    '<div class="ocr-progress"><div class="bar-track"><div class="bar-fill" id="ocrBar" style="width:0%"></div></div>' +
    '<div class="bar-label" id="ocrLabel">Iniciando OCR...</div></div>'
  );

  try {
    var result = await Tesseract.recognize(file, 'spa', {
      logger: function(m) {
        var bar = document.getElementById('ocrBar');
        var label = document.getElementById('ocrLabel');
        if (bar && m.progress) bar.style.width = Math.round(m.progress * 100) + '%';
        if (label) {
          if (m.status === 'recognizing text') label.textContent = 'Reconociendo texto...';
          else if (m.status === 'loading tesseract core') label.textContent = 'Cargando motor OCR...';
          else if (m.status === 'initializing tesseract') label.textContent = 'Inicializando...';
          else label.textContent = m.status || 'Procesando...';
        }
      }
    });

    var ocrText = result.data.text;
    console.log('OCR Text:', ocrText);

    if (!ocrText || ocrText.trim().length < 10) {
      addMessage('bot', 'No pude leer suficiente texto en esa imagen. Proba con una foto mas clara o con mejor iluminacion.');
      return;
    }

    addMessage('bot', 'Texto extraido. Analizando ingredientes y precios...');
    setTyping(true);

    var ctx = await getSupabaseContext();
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: 'Analiza esta factura y extrae los ingredientes de reposteria con sus precios.',
        userId: 'web-user',
        context: { inventario: ctx + ' | texto_factura: ' + ocrText }
      })
    });
    var data = await res.json();
    if (!data.success) throw new Error(data.error);
    var parsed = parseBotResponse(data.text);

    if (parsed.text) addMessage('bot', parsed.text);

    if (parsed.action && parsed.action.type === 'FACTURA_ITEMS' && parsed.action.data.items) {
      facturaItems = parsed.action.data.items.map(function(item) {
        return {
          nombre: item.nombre || '',
          precio_actual: parseFloat(item.precio_actual) || 0,
          unidad: item.unidad || 'u',
          cantidad: parseInt(item.cantidad) || 1
        };
      });
      addBotCustomMessage('<div class="rich-section">Items detectados — Edita lo que necesites</div>' + renderFacturaTable(facturaItems));
    } else {
      addMessage('bot', 'No pude detectar ingredientes en la factura. Proba con una imagen mas clara o carga los ingredientes manualmente.');
    }
  } catch (err) {
    console.error('Error OCR:', err);
    addMessage('bot', 'Error al procesar la imagen. Proba de nuevo con una foto mas nitida.');
  } finally {
    setTyping(false);
  }
}

window.saveRecipeFromSummary = saveRecipeFromSummary;

/* ═══════════════════════════════════════════
   ENVIAR AL BOT
   ═══════════════════════════════════════════ */
async function sendToBot(question, isSystemMessage) {
  if (isProcessing || !question.trim()) return;
  isProcessing = true;
  sendBtn.disabled = true;
  if (!isSystemMessage) addMessage('user', question);
  suggestions.style.display = 'none';
  setTyping(true);

  try {
    var ctx = await getSupabaseContext();
    var recipeContext = '';
    if (recipeFlow.active) {
      recipeContext = ' | flujo_receta_activo:true | paso_receta:' + recipeFlow.step + ' | datos_receta_hasta_ahora:' + JSON.stringify(recipeFlow.data);
    }

    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: question,
        userId: 'web-user',
        context: { inventario: ctx + recipeContext }
      })
    });
    var data = await res.json();
    if (!data.success) throw new Error(data.error || 'Error');
    var parsed = parseBotResponse(data.text);

    if (parsed.text) addMessage('bot', parsed.text);

    if (parsed.action) {
      var action = parsed.action;

      if (action.type === 'INICIAR_RECETA') {
        addBotCustomMessage(
          '<p>Para agregar una receta nueva de forma guiada, toca el boton:</p>' +
          '<button class="chat-btn primary" onclick="startRecipeFlow()"><i class="fa-solid fa-wand-magic-sparkles"></i> Iniciar Paso a Paso</button>'
        );
      }
      else if (action.type === 'RECETA_PASO' && action.data.step) {
        var stepNum = parseInt(action.data.step);
        var stepInfo = RECIPE_STEPS[stepNum - 1];
        var value = action.data.value;
        if (stepInfo.type === 'number') {
          value = parseFloat(String(value).replace(/[^0-9.,]/g, '').replace(',', '.'));
          if (isNaN(value)) value = 0;
        }
        recipeFlow.data[stepInfo.key] = value;
        recipeFlow.step = stepNum + 1;
        if (recipeFlow.step > RECIPE_STEPS.length) {
          addBotCustomMessage(renderRecipeSummary(recipeFlow.data));
          recipeFlow.step = 0;
        }
      }
      else if (action.type === 'FACTURA_ITEMS' && action.data.items) {
        facturaItems = action.data.items.map(function(item) {
          return {
            nombre: item.nombre || '',
            precio_actual: parseFloat(item.precio_actual) || 0,
            unidad: item.unidad || 'u',
            cantidad: parseInt(item.cantidad) || 1
          };
        });
        addBotCustomMessage('<div class="rich-section">Items detectados — Edita lo que necesites</div>' + renderFacturaTable(facturaItems));
      }
      else if (action.type === 'REGISTRAR_INGREDIENTE' || action.type === 'ACTUALIZAR_PRECIO' || action.type === 'ACTUALIZAR_STOCK') {
        var result = await executeDbAction(action);
        addMessage('bot', result.message, result.success ? 'action-ok' : 'action-err');
      }
    }

    setConnStatus('online');
  } catch (e) {
    console.error(e);
    addMessage('bot', 'Ups, no pude conectar con mi cerebro IA.');
    setConnStatus('offline');
  } finally {
    setTyping(false);
    isProcessing = false;
    sendBtn.disabled = !chatInput.value.trim();
  }
}

/* Input events */
chatInput.addEventListener('input', function() {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
  sendBtn.disabled = !chatInput.value.trim() || isProcessing;
});
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    var t = chatInput.value.trim();
    if (t && !isProcessing) { chatInput.value = ''; chatInput.style.height = 'auto'; sendToBot(t); }
  }
});
sendBtn.addEventListener('click', function() {
  var t = chatInput.value.trim();
  if (t && !isProcessing) { chatInput.value = ''; chatInput.style.height = 'auto'; sendBtn.disabled = true; sendToBot(t); }
});
suggestions.addEventListener('click', function(e) {
  var chip = e.target.closest('.suggestion-chip');
  if (chip && !isProcessing) sendToBot(chip.dataset.q);
});

/* ═══════════════════════════════════════════
   INVENTARIO CRUD
   ═══════════════════════════════════════════ */
var orderColByTable = { ingredientes: 'ultima_actualizacion', recetas: 'fecha_creacion' };

function stockBadgeClass(c) { var n = Number(c || 0); if (n === 0) return 'out'; if (n <= 3) return 'low'; return 'ok'; }
function stockBadgeText(c) { var n = Number(c || 0); if (n === 0) return 'Sin stock'; return n + ' u.'; }

async function loadInventory() {
  invList.innerHTML = '<div class="spinner"></div>';
  try {
    var orderCol = orderColByTable[activeTab] || 'fecha_creacion';
    var res = await supabaseClient.from(activeTab).select('*').order(orderCol, { ascending: false });
    if (res.error) throw res.error;
    setDbStatus('ok');

    if (!res.data || !res.data.length) {
      invList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No hay registros</p></div>';
      return;
    }
    invList.innerHTML = '';
    res.data.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'inv-card';
      if (activeTab === 'ingredientes') {
        card.innerHTML = '<div class="inv-card-icon ing"><i class="fa-solid fa-wheat-awn"></i></div>' +
          '<div class="inv-card-info"><div class="inv-card-name">' + item.nombre + '</div><div class="inv-card-detail">' + item.unidad + '</div></div>' +
          '<span class="stock-badge ' + stockBadgeClass(item.cantidad) + '">' + stockBadgeText(item.cantidad) + '</span>' +
          '<div class="inv-card-price">$' + Number(item.precio_actual).toLocaleString('es-AR') + '</div>' +
          '<div class="inv-card-actions">' +
          '<button class="inv-btn edit" data-table="ingredientes" data-id="' + item.id + '"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="inv-btn delete" data-table="ingredientes" data-id="' + item.id + '"><i class="fa-solid fa-trash"></i></button></div>';
      } else {
        card.innerHTML = '<div class="inv-card-icon rec"><i class="fa-solid fa-book-open"></i></div>' +
          '<div class="inv-card-info"><div class="inv-card-name">' + item.nombre + '</div><div class="inv-card-detail">' + item.porciones + ' porc · ' + item.margen_ganancia + '%</div></div>' +
          '<div class="inv-card-price">$' + Number(item.precio_sugerido).toLocaleString('es-AR') + '</div>' +
          '<div class="inv-card-actions">' +
          '<button class="inv-btn edit" data-table="recetas" data-id="' + item.id + '"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="inv-btn delete" data-table="recetas" data-id="' + item.id + '"><i class="fa-solid fa-trash"></i></button></div>';
      }
      invList.appendChild(card);
    });
    invList.querySelectorAll('.inv-btn.edit').forEach(function(btn) {
      btn.addEventListener('click', function() { editItem(btn.dataset.table, btn.dataset.id); });
    });
    invList.querySelectorAll('.inv-btn.delete').forEach(function(btn) {
      btn.addEventListener('click', function() { confirmDelete(btn.dataset.table, btn.dataset.id); });
    });
  } catch (err) {
    console.error(err);
    setDbStatus('err');
    invList.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><p>Error al cargar</p></div>';
  }
}

var tableFields = {
  ingredientes: [
    { name: 'nombre', label: 'Nombre', type: 'text', required: true },
    { name: 'precio_actual', label: 'Precio ($)', type: 'number', required: true },
    { name: 'unidad', label: 'Unidad', type: 'text', required: true },
    { name: 'cantidad', label: 'Stock', type: 'number', required: false }
  ],
  recetas: [
    { name: 'nombre', label: 'Nombre', type: 'text', required: true },
    { name: 'porciones', label: 'Porciones', type: 'number', required: true },
    { name: 'costo_total', label: 'Costo total ($)', type: 'number', required: true },
    { name: 'margen_ganancia', label: 'Margen (%)', type: 'number', required: true },
    { name: 'precio_sugerido', label: 'Precio sugerido ($)', type: 'number', required: true }
  ]
};

document.getElementById('fabAdd').addEventListener('click', function() { openCrudModal(activeTab); });

function openCrudModal(table, data) {
  crudTable.value = table;
  crudId.value = data ? data.id : '';
  crudModalTitle.textContent = data ? 'Editar' : (table === 'ingredientes' ? 'Agregar ingrediente' : 'Agregar receta');
  var fields = tableFields[table];
  crudFields.innerHTML = '';
  fields.forEach(function(f) {
    var div = document.createElement('div');
    div.className = 'form-group';
    var val = data ? data[f.name] : (f.name === 'unidad' ? 'g' : (f.name === 'cantidad' ? '0' : ''));
    div.innerHTML = '<label class="form-label">' + f.label + '</label>' +
      '<input class="form-input" name="' + f.name + '" type="' + f.type + '"' +
      (f.required ? ' required' : '') + ' value="' + val + '"' +
      (f.type === 'number' ? ' step="any"' : '') + '>';
    crudFields.appendChild(div);
  });
  crudModal.classList.add('visible');
}

async function editItem(table, id) {
  try {
    var res = await supabaseClient.from(table).select('*').eq('id', id).single();
    if (res.error) throw res.error;
    openCrudModal(table, res.data);
  } catch (err) { showToast('Error al cargar'); }
}

crudForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  var formData = new FormData(crudForm);
  var payload = Object.fromEntries(formData);
  Object.keys(payload).forEach(function(k) {
    var field = tableFields[crudTable.value].find(function(f) { return f.name === k && f.type === 'number'; });
    if (field && payload[k] !== '') { payload[k] = parseFloat(payload[k]); }
    else if (field && payload[k] === '') { delete payload[k]; }
  });
  try {
    var result;
    if (crudId.value) {
      result = await supabaseClient.from(crudTable.value).update(payload).eq('id', crudId.value).select();
    } else {
      result = await supabaseClient.from(crudTable.value).insert([payload]).select();
    }
    if (result.error) throw result.error;
    crudModal.classList.remove('visible');
    showToast(crudId.value ? 'Actualizado' : 'Creado');
    setDbStatus('ok');
    loadInventory();
  } catch (err) {
    console.error(err);
    setDbStatus('err');
    showToast('Error: ' + (err.message || 'Verifica datos'));
  }
});

function confirmDelete(table, id) {
  pendingDelete = { table: table, id: id };
  deleteModal.classList.add('visible');
}

document.getElementById('deleteConfirm').addEventListener('click', async function() {
  try {
    var res = await supabaseClient.from(pendingDelete.table).delete().eq('id', pendingDelete.id);
    if (res.error) throw res.error;
    deleteModal.classList.remove('visible');
    showToast('Eliminado');
    setDbStatus('ok');
    loadInventory();
  } catch (err) { setDbStatus('err'); showToast('Error'); }
});
document.getElementById('deleteCancel').addEventListener('click', function() { deleteModal.classList.remove('visible'); });
document.getElementById('crudCancel').addEventListener('click', function() { crudModal.classList.remove('visible'); });
[crudModal, deleteModal].forEach(function(modal) {
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.remove('visible'); });
});

chatInput.focus();
</script>
